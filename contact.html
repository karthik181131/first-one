<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Karthik's Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #181A20;
            color: #E0E1E6;
        }
        #contact {
            padding: 60px 20px;
            background-color: #23272F;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(65,105,225,0.10);
            max-width: 700px;
            margin: 40px auto;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h2 {
            font-size: 2.5em;
            color: #4169E1;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            color: #E0E1E6;
        }
        .button, .back-button {
            display: inline-block;
            padding: 10px 24px;
            font-size: 16px;
            color: #fff;
            background: #4169E1;
            text-decoration: none;
            border-radius: 6px;
            margin: 20px 0;
            vertical-align: middle;
            transition: background 0.3s;
            border: none;
            font-weight: 600;
        }
        .button:hover, .back-button:hover {
            background: #2746a8;
        }
        .icon {
            width: 50px;
            height: 50px;
            vertical-align: middle;
            margin-right: 10px;
        }
        .social-icons {
            margin-top: 20px;
        }
        .social-icon {
            display: inline-block;
            margin: 0 15px;
        }
        .social-icon img {
            width: 50px;
            height: 50px;
            vertical-align: middle;
            transition: opacity 0.3s;
            border-radius: 8px;
            background: #23272F;
            box-shadow: 0 1px 4px rgba(65,105,225,0.10);
        }
        .social-icon img:hover {
            opacity: 0.7;
        }
        .contact-info {
            margin-top: 20px;
            font-size: 1.1em;
            color: #E0E1E6;
        }
    </style>
</head>
<body>
    <section id="contact">
        <div class="container">
            <h2>Contact</h2>
            <p>Feel free to reach out!</p>
            <form style="margin: 0 auto; max-width: 400px; text-align: left; background: #23272F; padding: 28px 20px; border-radius: 10px; box-shadow: 0 2px 10px rgba(65,105,225,0.10);">
                <div style="margin-bottom: 16px;">
                    <label for="name" style="display:block; color:#E0E1E6; font-weight:500;">Name</label>
                    <input type="text" id="name" name="name" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #4169E1; background:#181A20; color:#E0E1E6;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label for="email" style="display:block; color:#E0E1E6; font-weight:500;">Email</label>
                    <input type="email" id="email" name="email" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #4169E1; background:#181A20; color:#E0E1E6;">
                </div>
                <div style="margin-bottom: 16px;">
                    <label for="message" style="display:block; color:#E0E1E6; font-weight:500;">Message</label>
                    <textarea id="message" name="message" rows="4" required style="width:100%; padding:10px; border-radius:6px; border:1px solid #4169E1; background:#181A20; color:#E0E1E6;"></textarea>
                </div>
                <button type="submit" style="background:#4169E1; color:#fff; border:none; border-radius:6px; padding:12px 28px; font-weight:600; font-size:1.1rem; cursor:pointer; width:100%;">Send Message</button>
            </form>
            <a href="mailto:karthik9505866@gmail.com" class="button">
                <img src="mail.png" alt="Email Icon" class="icon"> Email Me
            </a>
            <div class="social-icons">
                <a href="https://www.linkedin.com/in/boddepalli-karthik-35867a287" target="_blank" class="social-icon">
                    <img src="linkedin.png" alt="LinkedIn Icon" class="icon">
                </a>
                <a href="https://www.instagram.com/invites/contact/?igsh=5njlcmhdd1ve&utm_content=mb3kh5l" target="_blank" class="social-icon">
                    <img src="instagram.jpeg" alt="Instagram Icon" class="icon">
                </a>
            </div>
            <a href="index.html" class="back-button">BACK</a>
        </div>
    </section>
</body>
</html>
