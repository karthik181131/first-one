<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Karthik</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #181A20;
            color: #E0E1E6;
        }
        #about-me {
            background-color: #23272F;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(65,105,225,0.10);
            max-width: 600px;
            margin: 50px auto;
            padding: 32px 24px;
            text-align: center;
        }
        #about-me h2 {
            font-size: 2em;
            color: #4169E1;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        #about-me p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #E0E1E6;
        }
        #about-me strong {
            color: #4169E1;
        }
        .back-button-container {
            margin-top: 30px;
            text-align: center;
        }
        .back-button-container a button {
            padding: 10px 24px;
            font-size: 16px;
            color: #fff;
            background: #4169E1;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s, color 0.3s;
        }
        .back-button-container a button:hover {
            background: #2746a8;
            color: #fff;
        }
    </style>
</head>
<body>

<section id="about-me">
    <h2>About Me</h2>
    <p>I'm <strong>Karthik</strong>, a data science and web development enthusiast. I enjoy working on deep learning projects and analyzing data for meaningful insights. In web development, I focus on creating responsive and user-friendly websites. My recent work includes image classification using CNN.</p>
    
    <div class="back-button-container">
        <a href="index.html">
            <button>Back</button>
        </a>
    </div>
</section>

</body>
</html>
